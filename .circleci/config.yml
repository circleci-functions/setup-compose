version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  prerelease:
    type: boolean
    default: false
    description: >-
      Publish this branch as a pre-release instead of running the full suite
      (see RELEASE.md). Set it when triggering a pipeline from the UI.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # The VMs have a Docker engine of their own, so published ports are on
  # loopback, as they are for most users.
  machine:
    machine:
      image: ubuntu-2404:current
  machine-arm:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
  # No Go and no engine: Docker is the remote one setup_remote_docker starts.
  base:
    docker:
      - image: cimg/base:stable

commands:
  acceptance:
    description: >-
      Run the packaged acceptance suite against the packaged binary, so the
      executor needs no Go, no modules and no checkout. test2json and gotestsum
      turn the suite's output into the JUnit CircleCI collects; gotestsum warns
      that it cannot find `go`, which is harmless.
    parameters:
      platform:
        type: string
        default: linux/amd64
        description: The os/arch whose artifacts to run.
      run:
        type: string
        default: "."
        description: Test name pattern to pass to -test.run.
      phase:
        type: string
        default: ""
        description: SETUP_COMPOSE_FOLLOW_PHASE, for a test split across steps.
      step-name:
        type: string
        default: Run the acceptance suite
    steps:
      - run:
          name: << parameters.step-name >>
          command: |
            mkdir -p test-results
            ./dist/tools/<< parameters.platform >>/gotestsum \
              --junitfile "test-results/acceptance<< parameters.phase >>.xml" \
              --format standard-verbose \
              --raw-command -- \
              ./dist/tools/<< parameters.platform >>/test2json \
                -p acceptance \
                ./dist/acceptance/<< parameters.platform >>/acceptance \
                -test.v=test2json -test.timeout 20m -test.run '<< parameters.run >>'
          environment:
            SETUP_COMPOSE_BINARY: ./dist/setup-compose/<< parameters.platform >>/setup-compose
            SETUP_COMPOSE_FOLLOW_PHASE: << parameters.phase >>
            SETUP_COMPOSE_FOLLOW_DIR: /tmp/setup-compose-follow

jobs:
  test:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-compose-go-{{ checksum "go.sum" }}-
            - setup-compose-go-
      - run: task lint
      # A release is the only thing that runs `task publish`, so a missing task
      # would otherwise surface at release time.
      - run: task lint-tasks
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-compose-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-compose into ./dist and persists it to the workspace,
  # with the acceptance suite and the tools to report it, so the jobs below
  # exercise exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-compose-go-{{ checksum "go.sum" }}-
            - setup-compose-go-
      - run: task dry-run
      - run: task build-acceptance
      - run: task build-tools
      - persist_to_workspace:
          root: .
          paths:
            - dist

  acceptance:
    executor: machine
    steps:
      - attach_workspace:
          at: .
      - acceptance
      - store_test_results:
          path: test-results

  acceptance-arm:
    executor: machine-arm
    steps:
      - attach_workspace:
          at: .
      - acceptance:
          platform: linux/arm64
      - store_test_results:
          path: test-results

  # The tests that need published ports on loopback skip themselves here; the
  # rest, and the remote-engine test, run.
  acceptance-remote-docker:
    executor: base
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: .
      - acceptance
      - store_test_results:
          path: test-results

  # The log followers `up` leaves behind have to outlive the step that started
  # them, not just its process, so the check runs in a step of its own.
  follow-across-steps:
    executor: machine
    steps:
      - attach_workspace:
          at: .
      - acceptance:
          step-name: Start a project and return
          run: TestAcceptance_FollowsAfterTheStep
          phase: start
      - acceptance:
          step-name: Check its logs are still followed
          run: TestAcceptance_FollowsAfterTheStep
          phase: check
      - store_test_results:
          path: test-results

workflows:
  test-publish:
    when:
      not: << pipeline.parameters.prerelease >>
    jobs:
      - test
      - build
      - acceptance:
          requires: [build]
      - acceptance-arm:
          requires: [build]
      - acceptance-remote-docker:
          requires: [build]
      - follow-across-steps:
          requires: [build]
      - toolkit/release-pr:
          name: release-pr
          executor: go
          cache-prefix: setup-compose-go
          # One at a time, so two pushes can't race to rewrite release/next.
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires
            - test
            - build
            - acceptance
            - acceptance-arm
            - acceptance-remote-docker
            - follow-across-steps
          context: [github-release]
          filters:
            branches:
              only: main
      - toolkit/publish:
          name: publish
          executor: go
          cache-prefix: setup-compose-go
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main

  # Triggered by hand, so it skips the acceptance jobs: the pre-release is what
  # gets tested. Only maintainers can publish one.
  prerelease:
    when: << pipeline.parameters.prerelease >>
    jobs:
      - test
      - build
      - toolkit/publish-prerelease:
          name: publish-prerelease
          executor: go
          cache-prefix: setup-compose-go
          requires: [test, build]
          context: [functions-prerelease]
